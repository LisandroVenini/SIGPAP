name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: sigpap_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            APP_ENV: testing
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: sigpap_test
            DB_USERNAME: postgres
            DB_PASSWORD: postgres

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo_pgsql
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare Laravel environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run Pint
              run: ./vendor/bin/pint --test

            - name: Run PHPUnit
              run: php artisan test

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: TypeScript type check
              run: npm run typecheck

            - name: Lint JavaScript / Vue
              run: npm run lint:js

            - name: Run Vitest
              run: npm run test:js

            - name: Build assets
              run: npm run build
